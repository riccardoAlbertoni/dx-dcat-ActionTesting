# Override respecConfig for W3C deployment and validators.
name: Echidna Auto-publish
on:
  pull_request:
    paths: ["TR/**"]
  push:
    branches: [main] # should this be gh-pages?
    paths: ["TR/**"]
jobs:
  main:
    name: Echidna Auto-publish WD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: w3c/spec-prod@v2
        with:
          TOOLCHAIN: respec
          SOURCE: TR/index.html
          VALIDATE_LINKS: false # true?
          VALIDATE_MARKUP: true
          ACTIONS_STEP_DEBUG: true
          W3C_ECHIDNA_TOKEN: ${{ secrets.ECHIDNA_TOKEN }}
          W3C_WG_DECISION_URL: https://www.w3.org/2026/09/25-dx-dcat-minutes.html # change to point to decision to deploy auto-publish
          W3C_BUILD_OVERRIDE: | # status? , are we getting a new shortname?
            specStatus: CRD 
            shortName: vocab-dcat-3 